name: Code Quality
on:
  workflow_call:
    secrets:
      SEMGREP_APP_TOKEN_PUBLIC:
        required: true
        description: "required for analysis"
jobs:
  validation-job:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == false }}
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4.0.0
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: code quality analysis
        run: semgrep ci --pro-intrafile &> /dev/null
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN_PUBLIC }}
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
